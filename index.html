<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：讓畫面延伸到 iPhone 瀏海和底部 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8E7">

  <!-- T1.2 你來改：App 的名字 -->
  <title>Theo 日記</title>

  <!-- 加到主畫面用：App 資訊和圖示 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- T1.2 你來改：主畫面圖示下方顯示的名字 -->
  <meta name="apple-mobile-web-app-title" content="Theo 日記">

  <link rel="stylesheet" href="style.css?v=20261008g">
</head>
<body>

  <!-- ============================================
       圖示庫：定義一次，下面用 <use href="#名字"> 重複使用
       圖示來自 Lucide（lucide.dev）
       ============================================ -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="icon-target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-mic" viewBox="0 0 24 24">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
    </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </symbol>
    <symbol id="icon-book" viewBox="0 0 24 24">
      <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
    </symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24">
      <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>
    </symbol>
  </svg>

  <div class="app">

    <!-- ============================================
         上方：日期列
         ============================================ -->
    <header class="top-bar">
      <div class="date-switcher">
        <button class="icon-button" id="prev-day" aria-label="前一天">
          <svg class="icon"><use href="#icon-chevron-left"/></svg>
        </button>
        <div class="date-label" id="date-label">
          <!-- 日期由 app.js 填入 -->
        </div>
        <button class="icon-button" id="next-day" aria-label="後一天">
          <svg class="icon"><use href="#icon-chevron-right"/></svg>
        </button>
      </div>
      <button class="icon-button" id="reviews-button" aria-label="回顧">
        <svg class="icon"><use href="#icon-book"/></svg>
      </button>
      <button class="icon-button" id="goals-button" aria-label="目標">
        <svg class="icon"><use href="#icon-target"/></svg>
      </button>
      <button class="icon-button" id="settings-button" aria-label="設定">
        <svg class="icon"><use href="#icon-settings"/></svg>
      </button>
    </header>

    <!-- ============================================
         中間：聊天區（訊息由 app.js 放進來）
         ============================================ -->
    <main class="chat" id="chat"></main>

    <!-- ============================================
         下方：動作按鈕 + 輸入框
         ============================================ -->
    <footer class="bottom">
      <!-- 看以前的日子時，只會出現這個按鈕 -->
      <button class="back-to-today" id="back-to-today">回到今天</button>

      <div class="actions">
        <button class="action-button" id="ask-theo">
          <svg class="icon"><use href="#icon-message"/></svg>
          聽聽 Theo 的想法
        </button>
        <button class="action-button" id="end-day">
          <svg class="icon"><use href="#icon-moon"/></svg>
          結束今天
        </button>
      </div>

      <div class="input-row">
        <!-- T1.2 你來改：輸入框的提示文字 -->
        <textarea id="input" rows="1" placeholder="欸我跟你說……"></textarea>
        <button class="icon-button mic-button" id="mic-button" aria-label="語音輸入">
          <svg class="icon"><use href="#icon-mic"/></svg>
        </button>
        <button class="icon-button send-button" id="send-button" aria-label="送出">
          <svg class="icon"><use href="#icon-send"/></svg>
        </button>
      </div>
    </footer>

  </div>

  <!-- ============================================
       設定頁（按右上角齒輪打開，蓋在聊天頁上面）
       ============================================ -->
  <div class="page" id="settings-page" hidden>
    <header class="top-bar">
      <button class="icon-button" id="settings-back" aria-label="返回">
        <svg class="icon"><use href="#icon-chevron-left"/></svg>
      </button>
      <div class="page-title">設定</div>
      <div class="icon-button" aria-hidden="true"></div>
    </header>

    <div class="page-body">
      <section class="setting-section">
        <h2>Theo 的個性</h2>
        <!-- 選項由 app.js 根據 theo.js 的「個性列表」產生 -->
        <div id="personality-options"></div>
      </section>

      <section class="setting-section">
        <h2>AI 金鑰</h2>
        <p class="hint">平常用 Groq；Groq 不行時，自動換 Gemini。金鑰只存在這支手機上，只會用來跟各自的 AI 溝通。</p>

        <label class="key-label" for="groq-key-input">Groq（主力）</label>
        <div class="key-row">
          <input type="password" id="groq-key-input" placeholder="貼上 gsk_ 開頭的金鑰"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="icon-button toggle-key" data-for="groq-key-input" aria-label="顯示金鑰">
            <svg class="icon"><use href="#icon-eye"/></svg>
          </button>
        </div>
        <p class="status" id="groq-status"></p>

        <label class="key-label" for="gemini-key-input">Gemini（備援）</label>
        <div class="key-row">
          <input type="password" id="gemini-key-input" placeholder="貼上 Gemini 的金鑰"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="icon-button toggle-key" data-for="gemini-key-input" aria-label="顯示金鑰">
            <svg class="icon"><use href="#icon-eye"/></svg>
          </button>
        </div>
        <p class="status" id="gemini-status"></p>

        <button class="primary-button" id="save-key">儲存並測試連線</button>
      </section>
    </div>
  </div>

  <!-- ============================================
       目標頁（按右上角靶心打開）
       ============================================ -->
  <div class="page" id="goals-page" hidden>
    <header class="top-bar">
      <button class="icon-button" id="goals-back" aria-label="返回">
        <svg class="icon"><use href="#icon-chevron-left"/></svg>
      </button>
      <div class="page-title">目標</div>
      <div class="icon-button" aria-hidden="true"></div>
    </header>

    <div class="page-body">
      <button class="primary-button" id="add-goal">新增目標</button>

      <!-- 新增／編輯目標的表單 -->
      <form class="goal-form" id="goal-form" hidden>
        <label class="key-label" for="goal-what">要做什麼</label>
        <input class="text-input" id="goal-what" placeholder="例如：去運動">
        <label class="key-label" for="goal-date">日期</label>
        <input class="text-input" id="goal-date" type="date">
        <label class="key-label" for="goal-time">時段（可以不填）</label>
        <input class="text-input" id="goal-time" placeholder="例如：下午">
        <div class="form-buttons">
          <button type="button" class="action-button" id="goal-cancel">取消</button>
          <button type="submit" class="primary-button">儲存</button>
        </div>
      </form>

      <!-- 目標清單由 goals.js 放進來 -->
      <div id="goals-list"></div>
    </div>
  </div>

  <!-- ============================================
       回顧頁（按右上角書本打開）
       ============================================ -->
  <div class="page" id="reviews-page" hidden>
    <header class="top-bar">
      <button class="icon-button" id="reviews-back" aria-label="返回">
        <svg class="icon"><use href="#icon-chevron-left"/></svg>
      </button>
      <div class="page-title">回顧</div>
      <div class="icon-button" aria-hidden="true"></div>
    </header>
    <div class="page-body">
      <!-- 回顧由 reviews.js 放進來 -->
      <div id="reviews-list"></div>
    </div>
  </div>

  <!-- 程式：順序很重要，前面的檔案要先載入
       ?v= 後面是版本號：每次更新都改一下，手機才不會用到舊的檔案 -->
  <script src="theo.js?v=20261008g"></script>
  <script src="storage.js?v=20261008g"></script>
  <script src="ai.js?v=20261008g"></script>
  <script src="goals.js?v=20261008g"></script>
  <script src="reviews.js?v=20261008g"></script>
  <script src="app.js?v=20261008g"></script>

</body>
</html>
